name: Build Pocket Frontend Preview

on:
  push:
    branches: [feat/pocket-multisystem-frontend]
    paths:
      - '.github/workflows/build-frontend-preview.yml'
      - 'scripts/**'
      - 'overrides/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact pinned backend and four native cores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/upstream
          git -C .work/upstream init
          git -C .work/upstream remote add origin https://github.com/Swordfish90/Lemuroid.git
          git -C .work/upstream fetch --depth 1 origin 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git -C .work/upstream checkout --detach FETCH_HEAD
          mkdir -p .work/upstream/lemuroid-cores
          git -C .work/upstream/lemuroid-cores init
          git -C .work/upstream/lemuroid-cores remote add origin https://github.com/Swordfish90/LemuroidCores.git
          git -C .work/upstream/lemuroid-cores sparse-checkout init --cone
          git -C .work/upstream/lemuroid-cores sparse-checkout set bundled-cores lemuroid_core_mgba lemuroid_core_gambatte lemuroid_core_snes9x lemuroid_core_melonds
          git -C .work/upstream/lemuroid-cores fetch --depth 1 origin fee2e824525daa22bcf318f96127fe43fa8a15ad
          git -C .work/upstream/lemuroid-cores checkout --detach FETCH_HEAD
      - name: Apply new portrait frontend and reliable multi-folder library
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_upstream.sh "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_shell_v2.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_game_menu.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_library_personalization.py "$GITHUB_WORKSPACE/.work/upstream"
          sed -i '/^import androidx.compose.material3.Button$/i import androidx.compose.material3.AlertDialog' .work/upstream/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/PocketShell.kt
          python3 scripts/apply_multisystem_frontend.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_frontend_visual.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_multi_folder_library.py "$GITHUB_WORKSPACE/.work/upstream"
          sed -i 's#@mipmap/lemuroid_launcher_round#@drawable/pocket_launcher_mark_round#' scripts/apply_original_launcher.py
          python3 scripts/apply_original_launcher.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_scan_reliability.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_portrait_entry.py "$GITHUB_WORKSPACE/.work/upstream"
      - name: Assert independent UI, safe scanning and four emulation cores
        shell: bash
        run: |
          set -euo pipefail
          for core in mgba gambatte snes9x melonds; do
            test -f ".work/upstream/lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/lib${core}_libretro_android.so"
          done
          grep -Fq 'SystemID.SNES, SystemID.NDS' .work/upstream/retrograde-app-shared/src/main/java/com/swordfish/lemuroid/lib/library/GameSystem.kt
          grep -Fq 'PocketPortraitLauncher(' .work/upstream/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/MainActivity.kt
          ! grep -Fq '            PocketShell(' .work/upstream/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/MainActivity.kt
          grep -Fq 'android:screenOrientation="portrait"' .work/upstream/lemuroid-app/src/main/AndroidManifest.xml
          grep -Fq 'pocket_library_roots_v1' .work/upstream/retrograde-app-shared/src/main/java/com/swordfish/lemuroid/lib/storage/local/StorageAccessFrameworkProvider.kt
          grep -Fq 'pocketRecognizeByExtension' .work/upstream/retrograde-app-shared/src/main/java/com/swordfish/lemuroid/lib/library/LemuroidLibrary.kt
          grep -Fq 'if (!scanCompleted) Timber.w' .work/upstream/retrograde-app-shared/src/main/java/com/swordfish/lemuroid/lib/library/LemuroidLibrary.kt
          test -s .work/upstream/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/PocketPortraitLauncher.kt
          test -s .work/upstream/lemuroid-app/src/main/res/drawable/pocket_launcher_mark.xml
      - name: Compile Pocket portrait APK
        working-directory: .work/upstream
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :lemuroid-app:assembleFreeBundleDebug
      - name: Verify four emulator engines in built APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find .work/upstream/lemuroid-app/build/outputs/apk -name '*free*bundle*debug*.apk' | head -n 1)"
          test -n "$apk"
          for core in mgba gambatte snes9x melonds; do
            unzip -Z1 "$apk" | grep -Fq "lib/arm64-v8a/lib${core}_libretro_android.so"
          done
          cp "$apk" Pocket-portrait-preview.apk
          ls -lh Pocket-portrait-preview.apk
          sha256sum Pocket-portrait-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-portrait-preview-apk
          path: Pocket-portrait-preview.apk
          if-no-files-found: error
          retention-days: 14
