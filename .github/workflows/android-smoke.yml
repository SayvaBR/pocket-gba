name: Pocket Independent Android UI Smoke
on:
  push:
    branches: [rewrite/pocket-launcher-independent]
    paths: ['.github/workflows/android-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact passing clean-room APK from run 35104101402
        uses: actions/download-artifact@v4
        with:
          name: Pocket-independent-launcher-debug
          repository: SayvaBR/pocket-gba
          run-id: 35104101402
          github-token: ${{ github.token }}
          path: qa/apk
      - name: Check app artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s qa/apk/app-debug.apk
          file qa/apk/app-debug.apk
          sha256sum qa/apk/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Android 35 actual launch, portrait interface and navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 720
          disable-animations: true
          script: >-
            mkdir -p qa/captures &&
            (adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton || true) &&
            adb install -r qa/apk/app-debug.apk &&
            adb shell am start -W -n br.sayva.pocketlauncher/.MainActivity &&
            sleep 8 &&
            adb shell pidof br.sayva.pocketlauncher &&
            adb shell uiautomator dump /sdcard/pocket.xml &&
            adb shell cat /sdcard/pocket.xml > qa/captures/01-home.xml &&
            grep -Fq 'P O C K E T' qa/captures/01-home.xml &&
            grep -Fq 'Consoles' qa/captures/01-home.xml &&
            grep -Fq 'Sua coleção' qa/captures/01-home.xml || grep -Fq 'Nenhum jogo importado' qa/captures/01-home.xml &&
            ! grep -Eiq 'isn.t responding|Close app|not responding' qa/captures/01-home.xml &&
            adb exec-out screencap -p > qa/captures/01-home.png &&
            adb shell input tap 405 270 &&
            sleep 3 &&
            adb shell uiautomator dump /sdcard/pocket.xml &&
            adb shell cat /sdcard/pocket.xml > qa/captures/02-navigation.xml &&
            adb exec-out screencap -p > qa/captures/02-navigation.png &&
            adb shell pidof br.sayva.pocketlauncher &&
            test -s qa/captures/01-home.png &&
            test -s qa/captures/02-navigation.png
      - name: Preserve screenshots and app tree even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pocket-independent-android-qa
          path: qa/captures/
          retention-days: 14
          if-no-files-found: warn
