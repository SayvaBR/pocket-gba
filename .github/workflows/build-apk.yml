name: Build Pocket GBA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Pocket GBA build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned Lemuroid source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Swordfish90/Lemuroid.git .work/upstream
          cd .work/upstream
          git checkout 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git submodule update --init --recursive
          git lfs install --local
          git lfs pull
          if [ -d lemuroid-cores/.git ] || [ -f lemuroid-cores/.git ]; then
            git -C lemuroid-cores lfs install --local
            git -C lemuroid-cores lfs pull
          fi

      - name: Apply Pocket GBA focus patch
        run: bash scripts/prepare_upstream.sh "$GITHUB_WORKSPACE/.work/upstream"

      - name: Build installable debug APK
        working-directory: .work/upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :lemuroid-app:assembleFreeBundleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find .work/upstream/lemuroid-app/build/outputs/apk -type f -name '*free*bundle*debug*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" PocketGBA-debug.apk
          ls -lh PocketGBA-debug.apk

      - name: Upload Pocket GBA APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGBA-debug-apk
          path: PocketGBA-debug.apk
          if-no-files-found: error
          retention-days: 30
