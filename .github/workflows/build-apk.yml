name: Build Pocket GBA APK

on:
  push:
    branches: [main, feat/library-personalization-navigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-gba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Pocket GBA build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned Lemuroid source and mGBA core only
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .work/upstream
          git -C .work/upstream init
          git -C .work/upstream remote add origin https://github.com/Swordfish90/Lemuroid.git
          git -C .work/upstream fetch --depth 1 origin 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git -C .work/upstream checkout --detach FETCH_HEAD

          rm -rf .work/upstream/lemuroid-cores
          mkdir -p .work/upstream/lemuroid-cores
          git -C .work/upstream/lemuroid-cores init
          git -C .work/upstream/lemuroid-cores remote add origin https://github.com/Swordfish90/LemuroidCores.git
          git -C .work/upstream/lemuroid-cores sparse-checkout init --cone
          git -C .work/upstream/lemuroid-cores sparse-checkout set bundled-cores lemuroid_core_mgba
          git -C .work/upstream/lemuroid-cores fetch --depth 1 origin fee2e824525daa22bcf318f96127fe43fa8a15ad
          git -C .work/upstream/lemuroid-cores checkout --detach FETCH_HEAD

      - name: Apply Pocket GBA frontend, navigation and game customization
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_upstream.sh "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_shell_v2.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_game_menu.py "$GITHUB_WORKSPACE/.work/upstream"
          python3 scripts/apply_library_personalization.py "$GITHUB_WORKSPACE/.work/upstream"
          # The dialog import belongs to the generated shell, not the retained Lemuroid backend.
          sed -i '/^import androidx.compose.material3.Button$/i import androidx.compose.material3.AlertDialog' .work/upstream/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/PocketShell.kt

      - name: Build installable debug APK
        working-directory: .work/upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :lemuroid-app:assembleFreeBundleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find .work/upstream/lemuroid-app/build/outputs/apk -type f -name '*free*bundle*debug*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" PocketGBA-debug.apk
          ls -lh PocketGBA-debug.apk

      - name: Upload Pocket GBA APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGBA-debug-apk
          path: PocketGBA-debug.apk
          if-no-files-found: error
          retention-days: 30
