name: Pocket GBA Rive CLI prototype

on:
  push:
    branches: [feat/rive-cli-prototype]
    paths:
      - '.github/workflows/rive-cli-prototype.yml'
      - 'motion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rive runtime dependencies on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1 libopengl0
      - name: Install official Rive CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://releases.rive.app/cli/install.sh -o "$RUNNER_TEMP/rive-install.sh"
          bash "$RUNNER_TEMP/rive-install.sh"
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Compile and render the CLI sample as integration smoke test
        shell: bash
        run: |
          set -euo pipefail
          rive doctor
          mkdir -p motion/out
          cp -R "$(rive samples --path)/rml_triangle" motion/pocket-motion
          rive motion/pocket-motion --verify --format=json
          rive motion/pocket-motion --once
          rive motion/pocket-motion --screenshot=motion/out/rest.png --viewport=390x844
          rive motion/pocket-motion --screenshot=motion/out/advanced.png --advance=1s --viewport=390x844
          find motion -type f -name '*.riv' -print
          test -s motion/out/rest.png
          test -s motion/out/advanced.png
      - name: Preserve Rive CLI proof (not yet integrated into APK)
        uses: actions/upload-artifact@v4
        with:
          name: pocket-gba-rive-cli-proof
          path: |
            motion/out/*.png
            motion/pocket-motion/build/*.riv
          retention-days: 14
          if-no-files-found: error
