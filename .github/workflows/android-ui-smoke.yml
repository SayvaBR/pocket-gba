name: Pocket GBA Android UI Smoke

on:
  push:
    branches: [test/android-emulator-smoke]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download exactly the feature APK artifact from passing build 29
        uses: actions/download-artifact@v4
        with:
          name: PocketGBA-debug-apk
          repository: SayvaBR/pocket-gba
          run-id: 35071074699
          github-token: ${{ github.token }}
          path: smoke/apk
      - name: Verify APK is the expected installable file
        shell: bash
        run: |
          test -s smoke/apk/PocketGBA-debug.apk
          file smoke/apk/PocketGBA-debug.apk
          sha256sum smoke/apk/PocketGBA-debug.apk
      - name: Enable KVM access
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Android 35 UI smoke — fresh boot, tabs, Android Back, resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 720
          script: >-
            mkdir -p smoke/captures &&
            (adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton || true) &&
            adb install -r smoke/apk/PocketGBA-debug.apk &&
            adb shell am start -W -n com.sayvabr.pocketgba.debug/com.swordfish.lemuroid.app.mobile.feature.main.MainActivity &&
            sleep 18 &&
            adb shell pidof com.sayvabr.pocketgba.debug &&
            adb exec-out screencap -p > smoke/captures/01-home.png &&
            adb shell input tap 400 2150 &&
            sleep 2 &&
            adb exec-out screencap -p > smoke/captures/02-library.png &&
            adb shell input tap 950 2150 &&
            sleep 2 &&
            adb exec-out screencap -p > smoke/captures/03-settings.png &&
            adb shell input keyevent 4 &&
            sleep 2 &&
            adb shell pidof com.sayvabr.pocketgba.debug &&
            adb exec-out screencap -p > smoke/captures/04-back-library.png &&
            adb shell input keyevent 3 &&
            adb shell am start -W -n com.sayvabr.pocketgba.debug/com.swordfish.lemuroid.app.mobile.feature.main.MainActivity &&
            sleep 3 &&
            adb shell pidof com.sayvabr.pocketgba.debug &&
            adb exec-out screencap -p > smoke/captures/05-resume-library.png &&
            test -s smoke/captures/01-home.png &&
            test -s smoke/captures/02-library.png &&
            test -s smoke/captures/03-settings.png &&
            test -s smoke/captures/04-back-library.png &&
            test -s smoke/captures/05-resume-library.png
      - name: Upload actual Android screenshots for visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-gba-library-v3-android-navigation
          path: smoke/captures/
          if-no-files-found: warn
          retention-days: 14
