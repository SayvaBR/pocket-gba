plugins { id 'com.android.application' }
android {
    namespace 'br.sayva.pocketlauncher'
    compileSdk 35
    defaultConfig { applicationId 'br.sayva.pocketlauncher'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0-gba' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
}

// AAR is built from pinned upstream *source* by .github/workflows/android.yml.
// Fail compilation if the native core is absent; never ship a fake "play" screen.
dependencies {
    implementation files('libs/mgba-core.aar')
}
